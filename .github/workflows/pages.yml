name: Publicar visor en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy shapely pyproj
      - run: python scripts/build_static.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Esperar a que GitHub liste el paquete para Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages"
          for intento in {1..10}; do
            if gh api "$endpoint" --jq '.artifacts | any(.name == "github-pages" and (.expired | not))' | grep -qx true; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub todavía no lista el paquete de Pages para esta ejecución."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
